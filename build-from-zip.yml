name: Build APK from zip
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          Z=$(ls *.zip 2>/dev/null | head -n1)
          [ -n "$Z" ] || { echo "No .zip in repo root yet - upload komaki-github-upload.zip"; exit 1; }
          mkdir app && unzip -q "$Z" -d app
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Build
        run: cd app && bash scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: komaki-x1-range-pro
          path: app/komaki-x1-range-pro.apk
      - name: Publish APK as a Release (easy download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Komaki APK build ${{ github.run_number }}
          files: app/komaki-x1-range-pro.apk
